# Render blueprint: web service + keep-alive cron
# Web service runs server.js (serves page + API)
# Cron service pings /api/health every 14 min to prevent Render free-tier sleep
#
# Free plan note: Render web services still sleep after ~15 min without traffic.
# The cron below pings the health endpoint to keep it warm, but it may still sleep
# during long quiet periods. First visit after sleep takes ~1 min to wake up.
services:
  - type: web
    name: fire-guestbook
    runtime: node
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PAT
        sync: false
      - key: SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGIN
        value: "https://whyismycomputeronfuckingfire.com.au,https://www.whyismycomputeronfuckingfire.com.au,https://sami9889.github.io"

  - type: cron
    name: fire-keepalive
    schedule: "*/13 * * * *"
    runtime: node
    buildCommand: echo "nothing to build"
    startCommand: node -e "const http=require('http');setInterval(()=>{http.get('https://fire-guestbook.onrender.com/api/health',()=>{})},0);process.stdin.resume();"
    envVars:
      - key: NODE_VERSION
        value: "20"
