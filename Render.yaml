services:
  - type: web
    name: fire-guestbook
    runtime: node
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PAT
        sync: false
      - key: SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
